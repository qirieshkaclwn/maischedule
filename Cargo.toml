[package]
name = "maischedule"
version = "0.2.0"
edition = "2021"
description = "Автоматическая синхронизация расписания МАИ с календарем (Webcal/iOS) и уведомлениями в Telegram на Rust"

[dependencies]
# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP Web Server
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }


# Сериализация и JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Криптография (хэширование MD5 для групп МАИ и SHA1 для UID календаря)
md-5 = "0.10"
sha1 = "0.10"

# Дата и время
chrono = { version = "0.4", features = ["serde"] }

# SQLite (статическая сборка bundled - без необходимости ставить sqlite в системе)
rusqlite = { version = "0.32", features = ["bundled"] }

# Переменные окружения (.env)
dotenvy = "0.15"

# Логирование
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Простая обработка ошибок
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
