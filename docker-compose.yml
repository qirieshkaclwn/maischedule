services:
  maischedule:
    build:
      context: .
      dockerfile: Dockerfile
    image: maischedule:latest
    container_name: maischedule
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env

    # Даем время сервису корректно сбросить SQLite WAL на диск при перезапуске
    stop_grace_period: 20s

    # На Rust сервис потребляет всего ~5–10 МБ RAM!
    # Лимит 32 МБ гарантирует, что контейнер никогда не превысит допустимый порог памяти.
    mem_limit: 32m
    mem_reservation: 16m
    cpus: 0.5
    pids_limit: 30

    tmpfs:
      - /tmp:size=8M

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    image: nginx:alpine
    container_name: maischedule-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - maischedule
    mem_limit: 32m
    cpus: 0.5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

