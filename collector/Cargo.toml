[package]
name = "mai-collector"
version = "0.1.0"
edition = "2021"
description = "Сборщик расписания МАИ: работает внутри сети МАИ, раз в сутки отправляет снапшот на основной сервер"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
socket2 = "0.5"
libc = "0.2"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
